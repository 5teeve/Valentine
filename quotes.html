<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citations Spéciales 💦</title>
    <link rel="stylesheet" href="quotes.css">
</head>
<body>
    <div class="quotes-container">
        <div class="header">
            <h1 class="main-title">💦 Citations Interdites 💦</h1>
            <p class="subtitle">Pour les adultes uniquement...</p>
        </div>
        
        <div class="quote-display">
            <div class="quote-card">
                <div class="quote-number">Citation #<span id="quote-number">1</span></div>
                <div class="quote-text" id="quote-text">Chargement...</div>
                <div class="quote-category" id="quote-category">💋 Romantic</div>
            </div>
        </div>
        
        <div class="controls">
            <button id="next-quote" class="btn-next">🔞 Citation suivante</button>
            <button id="random-category" class="btn-category">🎲 Catégorie aléatoire</button>
            <button id="back-main" class="btn-back">🏠 Retour</button>
        </div>
        
        <div class="categories">
            <div class="category-title">Catégories disponibles :</div>
            <div class="category-list">
                <button class="cat-btn" data-category="romantic">💋 Romantiques</button>
                <button class="cat-btn" data-category="dirty">🌶️ Sales</button>
                <button class="cat-btn" data-category="crazy">🔮 Folles</button>
                <button class="cat-btn" data-category="extreme">⚡ Extrêmes</button>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Citations vues :</span>
                <span id="quotes-viewed" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Catégorie préférée :</span>
                <span id="fav-category" class="stat-value">Aucune</span>
            </div>
        </div>
        
        <div class="warning">
            ⚠️ Ce contenu est destiné à un public averti
        </div>
    </div>
    
    <div class="background-effects">
        <div class="floating-hearts">💦 💕 💦 💕 💦 💕 💦 💕</div>
        <div class="floating-emojis">🍆 🍑 🌮 🍌 🍯 🍒 💦</div>
    </div>
    
    <script src="quotes.js"></script>
</body>
</html>
